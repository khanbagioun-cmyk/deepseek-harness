name: CodeZ unsigned installers

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codez-unsigned
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            script: package:mac:arm64:unsigned
            runner: macos-15
          - target: mac-x64
            script: package:mac:x64:unsigned
            runner: macos-15-intel
          - target: win-x64
            script: package:win:x64:unsigned
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.9.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write unsigned Windows settings
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @'
          DSH_DESKTOP_APP_ID=com.codez.desktop
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DOWNLOAD_TEST_ORIGIN=https://updates.codez.invalid
          DOWNLOAD_TEST_RELEASE_ID=00000000000000000000000000000000
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://updates.codez.invalid
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={"allowedAuthOrigins":["https://login.codez.invalid"]}
          '@ | Set-Content apps/desktop/.env.windows -Encoding utf8
      - name: Package ${{ matrix.target }}
        run: pnpm --filter @deepseek-ai/dsh-desktop run ${{ matrix.script }}
      - name: Checksums
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dir="apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts"
          find "$dir" -maxdepth 2 -type f -name '*.dmg' -print0 | xargs -0 shasum -a 256 > SHA256SUMS-${{ matrix.target }}
          cat SHA256SUMS-${{ matrix.target }}
      - name: Checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts"
          Get-ChildItem -Path "$dir\codez-*-unsigned.exe" -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content SHA256SUMS-${{ matrix.target }}
          Get-Content SHA256SUMS-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: codez-${{ matrix.target }}
          path: |
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/**/*.dmg
            SHA256SUMS-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: codez-${{ matrix.target }}
          path: |
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/codez-*-unsigned.exe
            SHA256SUMS-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Combine checksums
        run: |
          find artifacts -name 'SHA256SUMS-*' -exec cat {} \; > artifacts/SHA256SUMS
          cp docs/deploy/company-install/*.md artifacts/
          cat artifacts/SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="codez-v0.2.2-rc.1-company.1"
          gh release create "$tag" --draft --target "$GITHUB_SHA" \
            --title "CodeZ 0.2.2-rc.1 company.1" \
            --notes-file docs/deploy/company-install/release-notes.md
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name 'SHA256SUMS' -o -name '*.zh.md' -o -name 'README.md' -o -name 'macos.md' -o -name 'windows.md' -o -name 'uninstall.md' -o -name 'verify.md' -o -name 'vm.md' -o -name 'key.md' -o -name 'troubleshooting.md' \) -print0 \
            | xargs -0 gh release upload "$tag"
